# 가스사고 기사 목록 자동 갱신 — 매일 아침 공개 RSS 를 받아 data/news.json 을 고쳐 커밋합니다.
# 저장하는 것은 제목·링크·날짜·언론사뿐이고 기사 본문은 저장하지 않습니다.
# 손으로 돌릴 때: GitHub 리포 → Actions → 「가스사고 기사 목록 갱신」 → Run workflow  (또는 gh workflow run news.yml)
name: 가스사고 기사 목록 갱신

on:
  schedule:
    - cron: '10 22 * * *'   # 매일 07:10 (한국 시각)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RSS 받아 data/news.json 갱신
        run: node scripts/fetch-news.mjs
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- data/news.json; then
            echo "바뀐 기사 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "가스사고 기사 목록 자동 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push
